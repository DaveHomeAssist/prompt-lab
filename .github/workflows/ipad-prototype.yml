name: iOS Prototype

on:
  push:
    branches:
      - main
    paths:
      - prompt-lab-ios/**
      - contracts/promptlab-enhance-contract-v1.json
      - contracts/promptlab-library-v2.json
      - prompt-lab-source/scripts/verify-library-interchange.mjs
      - prompt-lab-source/prompt-lab-extension/src/constants.js
      - prompt-lab-source/prompt-lab-extension/src/lib/evalSchema.js
      - prompt-lab-source/prompt-lab-extension/src/lib/promptSchema.js
      - prompt-lab-source/prompt-lab-extension/src/lib/workspaceImport*.js
      - prompt-lab-source/prompt-lab-extension/src/lib/libraryMatching.js
      - prompt-lab-source/prompt-lab-extension/src/lib/followUpProvenance.js
      - .github/workflows/ipad-prototype.yml
  pull_request:
    paths:
      - prompt-lab-ios/**
      - contracts/promptlab-enhance-contract-v1.json
      - contracts/promptlab-library-v2.json
      - prompt-lab-source/scripts/verify-library-interchange.mjs
      - prompt-lab-source/prompt-lab-extension/src/constants.js
      - prompt-lab-source/prompt-lab-extension/src/lib/evalSchema.js
      - prompt-lab-source/prompt-lab-extension/src/lib/promptSchema.js
      - prompt-lab-source/prompt-lab-extension/src/lib/workspaceImport*.js
      - prompt-lab-source/prompt-lab-extension/src/lib/libraryMatching.js
      - prompt-lab-source/prompt-lab-extension/src/lib/followUpProvenance.js
      - .github/workflows/ipad-prototype.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build-and-test:
    name: Native build and test (${{ matrix.device_family }})
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device_family:
          - iPhone
          - iPad
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select ${{ matrix.device_family }} simulator
        shell: bash
        env:
          DEVICE_FAMILY: ${{ matrix.device_family }}
        run: |
          set -euo pipefail
          simulator_id=$(xcrun simctl list devices available --json | jq -r --arg family "$DEVICE_FAMILY" '[.devices[] | .[] | select(.isAvailable and (.name | startswith($family)))] | last | .udid')
          if [[ -z "$simulator_id" || "$simulator_id" == "null" ]]; then
            echo "No compatible installed $DEVICE_FAMILY simulator is available." >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Build native prototype
        run: >-
          xcodebuild build
          -project prompt-lab-ios/PromptLab.xcodeproj
          -scheme PromptLab
          -destination "platform=iOS Simulator,id=${SIMULATOR_ID}"

      - name: Test native unit suite
        run: >-
          xcodebuild test
          -project prompt-lab-ios/PromptLab.xcodeproj
          -scheme PromptLab
          -destination "platform=iOS Simulator,id=${SIMULATOR_ID}"
          -parallel-testing-enabled NO
          -only-testing:PromptLabTests
          -resultBundlePath native-unit-results.xcresult

      - name: Setup Node for Library compatibility
        uses: actions/setup-node@v4
        with:
          node-version-file: prompt-lab-source/.nvmrc

      - name: Verify actual native export through shared importer
        shell: bash
        run: |
          set -euo pipefail
          container=$(xcrun simctl get_app_container "$SIMULATOR_ID" com.davehomeassist.promptlab.prototype data)
          mkdir -p library-contract-evidence
          cp "$container/Documents/native-library-contract.json" library-contract-evidence/native-library-contract.json
          cp "$container/Documents/native-parent-edit-contract.json" library-contract-evidence/native-parent-edit-contract.json
          node prompt-lab-source/scripts/verify-library-interchange.mjs library-contract-evidence/native-library-contract.json --native-edit
          node prompt-lab-source/scripts/verify-library-interchange.mjs library-contract-evidence/native-parent-edit-contract.json --native-parent-edit
          git rev-parse HEAD > library-contract-evidence/source-sha.txt
          shasum -a 256 library-contract-evidence/*.json > library-contract-evidence/SHA256SUMS

      - name: Upload native compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-contract-${{ matrix.device_family }}
          path: |
            native-unit-results.xcresult
            library-contract-evidence/
          if-no-files-found: error

      - name: Test native UI smoke
        run: >-
          xcodebuild test
          -project prompt-lab-ios/PromptLab.xcodeproj
          -scheme PromptLab
          -destination "platform=iOS Simulator,id=${SIMULATOR_ID}"
          -parallel-testing-enabled NO
          -only-testing:PromptLabUITests
