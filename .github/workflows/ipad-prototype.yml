name: iOS Prototype

on:
  push:
    branches:
      - main
    paths:
      - prompt-lab-ios/**
      - contracts/promptlab-enhance-contract-v1.json
      - prompt-lab-source/prompt-lab-extension/src/constants.js
      - prompt-lab-source/prompt-lab-extension/src/lib/evalSchema.js
      - prompt-lab-source/prompt-lab-extension/src/lib/promptSchema.js
      - .github/workflows/ipad-prototype.yml
  pull_request:
    paths:
      - prompt-lab-ios/**
      - contracts/promptlab-enhance-contract-v1.json
      - prompt-lab-source/prompt-lab-extension/src/constants.js
      - prompt-lab-source/prompt-lab-extension/src/lib/evalSchema.js
      - prompt-lab-source/prompt-lab-extension/src/lib/promptSchema.js
      - .github/workflows/ipad-prototype.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build-and-test:
    name: Native build and test (${{ matrix.device_family }})
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device_family:
          - iPhone
          - iPad
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select ${{ matrix.device_family }} simulator
        shell: bash
        env:
          DEVICE_FAMILY: ${{ matrix.device_family }}
        run: |
          set -euo pipefail
          simulator_id=$(xcrun simctl list devices available --json | jq -r --arg family "$DEVICE_FAMILY" '[.devices[] | .[] | select(.isAvailable and (.name | startswith($family)))] | last | .udid')
          if [[ -z "$simulator_id" || "$simulator_id" == "null" ]]; then
            echo "No compatible installed $DEVICE_FAMILY simulator is available." >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Build native prototype
        run: >-
          xcodebuild build
          -project prompt-lab-ios/PromptLab.xcodeproj
          -scheme PromptLab
          -destination "platform=iOS Simulator,id=${SIMULATOR_ID}"

      - name: Test native unit suite
        run: >-
          xcodebuild test
          -project prompt-lab-ios/PromptLab.xcodeproj
          -scheme PromptLab
          -destination "platform=iOS Simulator,id=${SIMULATOR_ID}"
          -parallel-testing-enabled NO
          -only-testing:PromptLabTests

      - name: Test native UI smoke
        run: >-
          xcodebuild test
          -project prompt-lab-ios/PromptLab.xcodeproj
          -scheme PromptLab
          -destination "platform=iOS Simulator,id=${SIMULATOR_ID}"
          -parallel-testing-enabled NO
          -resultBundlePath "${RUNNER_TEMP}/PromptLabUITests-${{ matrix.device_family }}.xcresult"
          -only-testing:PromptLabUITests

      - name: Print failing UI diagnostics
        if: failure()
        shell: bash
        env:
          DEVICE_FAMILY: ${{ matrix.device_family }}
        run: |
          set -euo pipefail
          result_path="${RUNNER_TEMP}/PromptLabUITests-${DEVICE_FAMILY}.xcresult"
          tests_json="${RUNNER_TEMP}/PromptLabUITests-${DEVICE_FAMILY}-tests.json"
          attachments_dir="${RUNNER_TEMP}/PromptLabUITests-${DEVICE_FAMILY}-attachments"

          xcrun xcresulttool get test-results summary --path "$result_path"
          xcrun xcresulttool get test-results tests --path "$result_path" --compact > "$tests_json"
          test_id=$(jq -r '
            .. | objects
            | select(
                .nodeType? == "Test Case"
                and (.name? | contains("testPrimarySurfacePassesAccessibilityAudit"))
              )
            | .nodeIdentifierURL // .nodeIdentifier // empty
          ' "$tests_json" | head -n 1)

          if [[ -n "$test_id" ]]; then
            xcrun xcresulttool get test-results activities \
              --path "$result_path" \
              --test-id "$test_id" \
              --compact \
              | jq '{
                  testName,
                  relevantActivities: [
                    .testRuns.activities[]
                    | recurse(.childActivities[]?)
                    | select(.isAssociatedWithFailure or ((.attachments // []) | length > 0))
                    | {
                        title,
                        isAssociatedWithFailure,
                        attachments
                      }
                  ]
                }'
          fi

          xcrun xcresulttool export attachments \
            --path "$result_path" \
            --output-path "$attachments_dir" \
            --only-failures
          cat "$attachments_dir/manifest.json"

          while IFS= read -r attachment; do
            mime_type=$(file -b --mime-type "$attachment")
            case "$mime_type" in
              text/*|application/json|application/xml)
                echo "Diagnostic attachment: $(basename "$attachment")"
                sed -n '1,500p' "$attachment"
                ;;
            esac
          done < <(find "$attachments_dir" -type f ! -name manifest.json -print)

      - name: Upload failing UI result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: promptlab-ui-${{ matrix.device_family }}-${{ github.run_id }}
          path: ${{ runner.temp }}/PromptLabUITests-${{ matrix.device_family }}.xcresult
          if-no-files-found: error
          retention-days: 3
