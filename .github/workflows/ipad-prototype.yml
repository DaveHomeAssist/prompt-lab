name: iOS Prototype

on:
  push:
    branches:
      - main
    paths:
      - prompt-lab-ios/**
      - .github/workflows/ipad-prototype.yml
  pull_request:
    paths:
      - prompt-lab-ios/**
      - .github/workflows/ipad-prototype.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build-and-test:
    name: Native build and test (${{ matrix.device_family }})
    runs-on: macos-14
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        device_family:
          - iPhone
          - iPad
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select ${{ matrix.device_family }} simulator
        shell: bash
        env:
          DEVICE_FAMILY: ${{ matrix.device_family }}
        run: |
          set -euo pipefail
          runtime_id=$(xcrun simctl list runtimes --json | jq -r '[.runtimes[] | select(.isAvailable and (.identifier | contains("iOS")))] | last | .identifier')
          device_type_id=$(xcrun simctl list devicetypes --json | jq -r --arg family "$DEVICE_FAMILY" '[.devicetypes[] | select(.name | startswith($family))] | last | .identifier')
          if [[ -z "$runtime_id" || "$runtime_id" == "null" || -z "$device_type_id" || "$device_type_id" == "null" ]]; then
            echo "No compatible $DEVICE_FAMILY simulator runtime or device type is installed." >&2
            exit 1
          fi
          simulator_id=$(xcrun simctl create "Prompt Lab CI $DEVICE_FAMILY" "$device_type_id" "$runtime_id")
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Build native prototype
        run: >-
          xcodebuild build
          -project prompt-lab-ios/PromptLab.xcodeproj
          -scheme PromptLab
          -destination "platform=iOS Simulator,id=${SIMULATOR_ID}"

      - name: Test native prototype
        run: >-
          xcodebuild test
          -project prompt-lab-ios/PromptLab.xcodeproj
          -scheme PromptLab
          -destination "platform=iOS Simulator,id=${SIMULATOR_ID}"
