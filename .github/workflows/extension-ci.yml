name: Extension CI

on:
  push:
    branches:
      - main
    paths:
      - prompt-lab-source/scripts/diagnostic-sourcemaps*
      - prompt-lab-source/prompt-lab-extension/**
      - contracts/promptlab-enhance-contract-v1.json
      - contracts/promptlab-library-v2.json
      - prompt-lab-source/scripts/verify-library-interchange.mjs
      - prompt-lab-source/scripts/eval-davellm.mjs
      - prompt-lab-source/scripts/eval-davellm.test.mjs
      - .github/workflows/extension-ci.yml
      - prompt-lab-source/supabase/**
      - prompt-lab-source/api/sync/**
      - prompt-lab-source/tests/clerk-sync-webhook.test.mjs
      - prompt-lab-source/tests/account-sync-build.test.mjs
      - prompt-lab-source/tests/desktop-token-bridge.test.mjs
      - prompt-lab-source/scripts/account-sync-build.mjs
  pull_request:
    paths:
      - prompt-lab-source/scripts/diagnostic-sourcemaps*
      - prompt-lab-source/prompt-lab-extension/**
      - contracts/promptlab-enhance-contract-v1.json
      - contracts/promptlab-library-v2.json
      - prompt-lab-source/scripts/verify-library-interchange.mjs
      - prompt-lab-source/scripts/eval-davellm.mjs
      - prompt-lab-source/scripts/eval-davellm.test.mjs
      - .github/workflows/extension-ci.yml
      - prompt-lab-source/supabase/**
      - prompt-lab-source/api/sync/**
      - prompt-lab-source/tests/clerk-sync-webhook.test.mjs
      - prompt-lab-source/tests/account-sync-build.test.mjs
      - prompt-lab-source/tests/desktop-token-bridge.test.mjs
      - prompt-lab-source/scripts/account-sync-build.mjs

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prompt-lab-source/prompt-lab-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: prompt-lab-source/.nvmrc
          cache: npm
          cache-dependency-path: prompt-lab-source/prompt-lab-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Account sync (docs/ACCOUNT_SYNC_DESIGN.md): RLS and grant guards, protocol,
      # quotas, concurrency on a throwaway local Postgres 17, engine end to end,
      # webhook and build wiring. Runs in this job so it adds no workflow run.
      - name: Install account sync test dependencies
        working-directory: prompt-lab-source/supabase
        run: npm ci

      - name: Test account sync
        working-directory: prompt-lab-source
        run: npm run test:sync

      # The DaveLLM eval runner imports the Enhance payload, PII gate, parser and checkTraits.
      - name: Test DaveLLM eval runner
        run: node --test ../scripts/eval-davellm.test.mjs

      - name: Build extension
        run: npm run build

      - name: Test diagnostic source map separation
        run: node --test ../scripts/diagnostic-sourcemaps.test.mjs

      - name: Retain diagnostic source maps
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-maps-extension-${{ github.sha }}
          path: prompt-lab-source/prompt-lab-extension/.diagnostic-source-maps
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
