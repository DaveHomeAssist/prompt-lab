name: Version Consistency
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: prompt-lab-source/.nvmrc
      - run: node prompt-lab-source/scripts/check-version-consistency.mjs
      - run: node --test prompt-lab-source/scripts/versioning.test.mjs
