name: Production Smoke

# Phase 0 guardrail for docs/VIEWPORT_SHELL_OVERHAUL_PLAN.md.
#
# This ran on workflow_dispatch only, so nothing ever checked production
# automatically. A functional regression could therefore stay live and
# invisible for as long as nobody happened to click Run workflow.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Acceptance scenarios to run
        type: choice
        default: all
        options:
          - all
          - library
          - activation
          - billing
          - owner
          - billing-lifecycle
  schedule:
    # Every 6 hours. GitHub runs scheduled workflows on the default branch,
    # so this always exercises what production is actually built from.
    - cron: '0 */6 * * *'

permissions:
  contents: read

concurrency:
  group: promptlab-production-free-account-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Signed-in Free Account
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production – prompt-lab
    defaults:
      run:
        working-directory: prompt-lab-source/prompt-lab-extension
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      PROMPTLAB_QA_FREE_USER_ID: ${{ secrets.PROMPTLAB_QA_FREE_USER_ID }}
      PROMPT_LAB_PRODUCTION_URL: https://promptlab.tools/app/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: prompt-lab-source/.nvmrc
          cache: npm
          cache-dependency-path: prompt-lab-source/prompt-lab-extension/package-lock.json

      - name: Install pinned dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare isolated test billing dependencies
        if: inputs.scope == 'billing-lifecycle'
        run: |
          npm ci --prefix ..
          docker run --detach --name promptlab-billing-test redis:7.4-alpine
          curl --fail --silent --show-error --location https://github.com/stripe/stripe-cli/releases/download/v1.53.1/stripe_1.53.1_linux_x86_64.tar.gz -o /tmp/stripe_1.53.1_linux_x86_64.tar.gz
          curl --fail --silent --show-error --location https://github.com/stripe/stripe-cli/releases/download/v1.53.1/stripe-linux-checksums.txt -o /tmp/stripe-checksums.txt
          (cd /tmp && grep 'stripe_1.53.1_linux_x86_64.tar.gz$' stripe-checksums.txt | sha256sum --check --strict)
          tar -xzf /tmp/stripe_1.53.1_linux_x86_64.tar.gz -C /tmp stripe

      - name: Run isolated billing lifecycle
        if: inputs.scope == 'billing-lifecycle'
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_TEST_ACCOUNT_ID: acct_1TE0qmAsNArhoaC1
          PROMPTLAB_STRIPE_TEST_RUN: 'true'
          PROMPTLAB_BILLING_LIFECYCLE_SMOKE: 'true'
        run: npm run test:e2e:production-free -- production-billing-lifecycle.spec.js

      - name: Remove isolated test store
        if: always() && inputs.scope == 'billing-lifecycle'
        run: docker rm --force promptlab-billing-test

      - name: Run signed-in production acceptance
        if: inputs.scope != 'billing-lifecycle'
        env:
          SMOKE_SCOPE: ${{ inputs.scope || 'all' }}
          PROMPTLAB_OWNER_GITHUB_LOGIN: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$SMOKE_SCOPE" = "library" ]; then
            npm run test:e2e:production-free -- production-library.spec.js production-library-restart.spec.js
          elif [ "$SMOKE_SCOPE" = "activation" ]; then
            npm run test:e2e:production-free -- production-activation.spec.js
          elif [ "$SMOKE_SCOPE" = "billing" ]; then
            PROMPTLAB_BILLING_CHECKOUT_SMOKE=true npm run test:e2e:production-free -- production-billing.spec.js
          elif [ "$SMOKE_SCOPE" = "owner" ]; then
            PROMPTLAB_OWNER_ACCESS_SMOKE=true npm run test:e2e:production-free -- production-owner.spec.js
          else
            npm run test:e2e:production-free
          fi
