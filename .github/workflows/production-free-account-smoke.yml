name: Production Smoke

# Phase 0 guardrail for docs/VIEWPORT_SHELL_OVERHAUL_PLAN.md.
#
# This ran on workflow_dispatch only, so nothing ever checked production
# automatically. A functional regression could therefore stay live and
# invisible for as long as nobody happened to click Run workflow.
on:
  workflow_dispatch:
  schedule:
    # Every 6 hours. GitHub runs scheduled workflows on the default branch,
    # so this always exercises what production is actually built from.
    - cron: '0 */6 * * *'

permissions:
  contents: read

concurrency:
  group: promptlab-production-free-account-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Signed-in Free Account
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production – prompt-lab
    defaults:
      run:
        working-directory: prompt-lab-source/prompt-lab-extension
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      PROMPTLAB_QA_FREE_USER_ID: ${{ secrets.PROMPTLAB_QA_FREE_USER_ID }}
      PROMPT_LAB_PRODUCTION_URL: https://promptlab.tools/app/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: prompt-lab-source/.nvmrc
          cache: npm
          cache-dependency-path: prompt-lab-source/prompt-lab-extension/package-lock.json

      - name: Install pinned dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run signed-in production smoke (billing surface + core loop)
        run: npm run test:e2e:production-free
